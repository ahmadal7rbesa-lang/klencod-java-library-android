<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبتي</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2622;--mut:#7a726a;--ac:#1f6f5c;--acx:#fff;--bd:#e6dfd4;--dan:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--card:#211f1b;--tx:#efeae2;--mut:#a39b8f;--ac:#4cb89e;--acx:#0d1d18;--bd:#35312b;--dan:#f2918a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171613;--card:#211f1b;--tx:#efeae2;--mut:#a39b8f;--ac:#4cb89e;--acx:#0d1d18;--bd:#35312b;--dan:#f2918a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.7}
.w{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:24px;margin:8px 0 12px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
textarea{min-height:220px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:var(--acx)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--dan);border:1px solid var(--bd)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.it b{display:block;font-size:17px}
.it small{color:var(--mut)}
.it p{margin:4px 0 0;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;border-radius:999px;padding:14px 22px;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.v{display:none}.v.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#body{white-space:pre-wrap;word-wrap:break-word}
.emp{text-align:center;color:var(--mut);margin-top:48px}
</style>
</head>
<body>
<div class="w">
<div id="list" class="v on">
<h1>📚 مكتبتي</h1>
<button id="clip" style="width:100%;margin-bottom:8px">📋 احفظ ما نسخته الآن</button>
<label style="display:flex;align-items:center;gap:8px;color:var(--mut);margin-bottom:6px"><input type="checkbox" id="auto" style="width:auto;margin:0"> حفظ تلقائي لما أرجع للتطبيق بعد النسخ</label>
<div id="st" style="color:var(--ac);min-height:24px;font-size:14px"></div>
<textarea id="qp" placeholder="📥 الصق هنا (اضغط مطولًا ← لصق) وينحفظ فورًا" style="min-height:64px;height:64px"></textarea>
<input id="q" placeholder="ابحث…">
<div class="tabs"><button data-f="all" class="on">الكل</button><button data-f="text">نصوص</button><button data-f="book">كتب</button></div>
<div id="items"></div>
<button class="fab" id="add">＋ إضافة</button>
</div>

<div id="form" class="v">
<h1 id="ft">إضافة جديدة</h1>
<select id="type"><option value="text">نص</option><option value="book">كتاب</option></select>
<input id="title" placeholder="العنوان">
<input id="author" placeholder="المؤلف (اختياري)">
<textarea id="content" placeholder="الصق النص هنا…"></textarea>
<input type="file" id="file" accept=".txt,text/plain">
<div class="row"><button id="save">حفظ</button><button class="g" id="cancel">إلغاء</button></div>
</div>

<div id="read" class="v">
<div class="row"><button class="g" id="back">→ رجوع</button><button class="g" id="edit">تعديل</button><button class="d" id="del">حذف</button><button class="g" id="fm">أ−</button><button class="g" id="fp">أ＋</button></div>
<h1 id="rt"></h1><small id="ra"></small>
<div id="body"></div>
</div>
</div>

<script>
var K="library_v1",items=[],filter="all",cur=null,fs=18;
function load(){try{items=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){items=[]}}
function persist(){try{localStorage.setItem(K,JSON.stringify(items))}catch(e){alert("تعذر الحفظ على هذا الجهاز")}}
function $(i){return document.getElementById(i)}
function show(id){["list","form","read"].forEach(function(v){$(v).classList.toggle("on",v===id)});window.scrollTo(0,0)}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function render(){
  var q=$("q").value.trim().toLowerCase();
  var r=items.filter(function(i){return(filter==="all"||i.type===filter)&&(!q||(i.title+" "+i.author+" "+i.content).toLowerCase().indexOf(q)>-1)});
  $("items").innerHTML=r.length?r.map(function(i){return '<div class="it" data-id="'+i.id+'"><b>'+(i.type==="book"?"📖 ":"📝 ")+esc(i.title)+'</b>'+(i.author?'<small>'+esc(i.author)+'</small>':'')+'<p>'+esc(i.content.slice(0,160))+'</p></div>'}).join(""):'<div class="emp">لا يوجد شيء محفوظ بعد.<br>اضغط «إضافة» للبدء.</div>';
}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b)});render()}});
$("q").oninput=render;
$("items").onclick=function(e){var t=e.target.closest(".it");if(!t)return;cur=items.find(function(i){return i.id===t.dataset.id});openRead()};
function openRead(){$("rt").textContent=cur.title;$("ra").textContent=cur.author||"";$("body").textContent=cur.content;$("body").style.fontSize=fs+"px";show("read")}
$("back").onclick=function(){render();show("list")};
$("fp").onclick=function(){fs=Math.min(34,fs+2);$("body").style.fontSize=fs+"px"};
$("fm").onclick=function(){fs=Math.max(12,fs-2);$("body").style.fontSize=fs+"px"};
function openForm(it){cur=it||null;$("ft").textContent=it?"تعديل":"إضافة جديدة";$("type").value=it?it.type:"text";$("title").value=it?it.title:"";$("author").value=it?it.author:"";$("content").value=it?it.content:"";$("file").value="";show("form")}
$("add").onclick=function(){openForm(null)};
$("edit").onclick=function(){openForm(cur)};
$("cancel").onclick=function(){cur?openRead():(render(),show("list"))};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("content").value=r.result;if(!$("title").value)$("title").value=f.name.replace(/\.[^.]+$/,"");$("type").value="book"};r.readAsText(f,"UTF-8")};
$("save").onclick=function(){
  var c=$("content").value.trim(),t=$("title").value.trim()||c.slice(0,30);
  if(!c){alert("اكتب أو الصق نصًا أولًا");return}
  if(cur&&items.indexOf(cur)>-1){cur.type=$("type").value;cur.title=t;cur.author=$("author").value.trim();cur.content=c;persist();openRead()}
  else{items.unshift({id:String(Date.now()),type:$("type").value,title:t,author:$("author").value.trim(),content:c});persist();cur=null;render();show("list")}
};
$("del").onclick=function(){if(confirm("تحذف هذا العنصر؟")){items=items.filter(function(i){return i!==cur});persist();cur=null;render();show("list")}};
var lastClip="";
try{lastClip=localStorage.getItem(K+"_last")||""}catch(e){}
function setLast(t){lastClip=t;try{localStorage.setItem(K+"_last",t)}catch(e){}}
function note(m){$("st").textContent=m;setTimeout(function(){$("st").textContent=""},3000)}
function saveClip(manual){
  if(!navigator.clipboard||!navigator.clipboard.readText){if(manual)alert("المتصفح ما يدعم قراءة النسخ");return}
  navigator.clipboard.readText().then(function(t){
    t=(t||"").trim();
    if(!t){if(manual)note("ما فيه شي منسوخ");return}
    if(t===lastClip||items.some(function(i){return i.content===t})){setLast(t);if(manual)note("هذا النص محفوظ من قبل");return}
    items.unshift({id:String(Date.now()),type:t.length>5000?"book":"text",title:t.slice(0,30),author:"",content:t});
    setLast(t);persist();render();note("✓ انحفظ");
  }).catch(function(){if(manual)alert("اسمح للمتصفح بقراءة النسخ ثم جرّب مرة ثانية")});
}
$("clip").onclick=function(){saveClip(true)};
var au=true;try{au=localStorage.getItem(K+"_auto")!=="0"}catch(e){}
$("auto").checked=au;
$("auto").onchange=function(){try{localStorage.setItem(K+"_auto",this.checked?"1":"0")}catch(e){}};
function addText(t){t=(t||"").trim();if(!t)return false;if(items.some(function(i){return i.content===t})){note("هذا النص محفوظ من قبل");return false}items.unshift({id:String(Date.now()),type:t.length>5000?"book":"text",title:t.slice(0,30),author:"",content:t});setLast(t);persist();render();note("✓ انحفظ");return true}
$("qp").oninput=function(){var t=this.value;this.value="";addText(t)};
function tryAuto(){
  if(!$("auto").checked||!$("list").classList.contains("on")||document.hidden)return;
  var fail=function(){note("المتصفح يمنع القراءة التلقائية، الصق في الخانة تحت")};
  if(!navigator.clipboard||!navigator.clipboard.readText){fail();return}
  navigator.clipboard.readText().then(function(t){t=(t||"").trim();if(t&&t!==lastClip)addText(t)}).catch(fail);
}
document.addEventListener("visibilitychange",tryAuto);
window.addEventListener("focus",tryAuto);
load();render();
function pull(){try{if(!window.Android)return;var a=JSON.parse(Android.takePending()||"[]"),n=0;a.forEach(function(p){if(p.text&&!items.some(function(i){return i.content===p.text})){items.unshift({id:String(Date.now()+(n++)),type:p.text.length>5000?"book":"text",title:p.title||p.text.slice(0,30),author:"",content:p.text})}});if(a.length){persist();render()}}catch(e){}}
window.appBack=function(){if(!$("list").classList.contains("on")){render();show("list");return true}return false};
if(window.Android){$("clip").style.display="none";$("auto").checked=false;$("auto").parentNode.style.display="none";$("qp").placeholder="\ud83d\udce5 \u0627\u0644\u0635\u0642 \u0647\u0646\u0627 \u0648\u064a\u0646\u062d\u0641\u0638 \u0641\u0648\u0631\u064b\u0627";pull()}
</script>
</body>
</html>
